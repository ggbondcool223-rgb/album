name: album_app
description: A photo album creation app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  styled_widget: ^0.4.1
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  dio: ^5.4.3+1
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^8.0.0
  flutter_switch: ^0.3.2
  fluttertoast: ^8.2.5
  image_picker: ^1.0.7
  flutter_timezone: ^3.0.0
  device_info_plus: ^10.1.0
  image: ^4.1.3
  permission_handler: ^11.3.0
  path_provider: ^2.1.1
  audioplayers: ^5.2.1
  pro_image_editor: ^11.15.1
  video_player: ^2.8.2
  image_gallery_saver_plus: ^4.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

  # flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  image_path: "assets/a_l.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/a_l.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/


